[project]
name = "motiffinding"
version = "0.1.0"
description = ""
authors = [{ name = "MoltenEcdysone09", email = "pradyumnah09@gmail.com" }]
requires-python = ">=3.13, <3.15"
dependencies = [
  "dotmotif (>=0.17.0,<0.18.0)",
  "networkx (>=3.6.1,<4.0.0)",
  "pandas (>=3.0.2,<4.0.0)",
  "numpy (>=2.4.4,<3.0.0)",
  "matplotlib (>=3.10.8,<4.0.0)",
  "seaborn (>=0.13.2,<0.14.0)",
  "jax[cuda13] (>=0.10.0,<0.11.0)",
  "pyarrow (>=24.0.0,<25.0.0)",
  "igraph (>=1.0.0,<2.0.0)",
  "statannotations (>=0.7.2,<0.8.0)",
  "statsmodels (>=0.14.6,<0.15.0)",
